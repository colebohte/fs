name: Fastfetch

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Fastfetch
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -L https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o fastfetch.deb
          sudo dpkg -i fastfetch.deb || sudo apt-get install -f -y

      - name: Run Fastfetch
        run: fastfetch > fastfetch.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-output
          path: fastfetch.txt
