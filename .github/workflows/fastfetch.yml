name: Fastfetch

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Fastfetch
        run: |
          sudo apt-get update
          sudo apt-get install -y fastfetch

      - name: Run Fastfetch and save output
        run: fastfetch > fastfetch.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-output
          path: fastfetch.txt
